  <script>
    const lexIsLocalPreview = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    if ("serviceWorker" in navigator) {
      if (lexIsLocalPreview) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => r.unregister());
        });
      } else {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((err) => {
            console.warn("Lex: service worker", err);
          });
        });
      }
    }
    window.addEventListener("online", () => {
      document.body.classList.remove("lex-offline-mode");
    });
    window.addEventListener("offline", () => {
      document.body.classList.add("lex-offline-mode");
    });
    if (!navigator.onLine) document.body.classList.add("lex-offline-mode");
  </script>
