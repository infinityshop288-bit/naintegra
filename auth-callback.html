<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Lex na Íntegra — Entrando…</title>
  <link rel="stylesheet" href="./css/styles.css?v=39" />
  <style>
    .oauth-callback-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .oauth-callback-page p { color: var(--muted); max-width: 28rem; }
  </style>
</head>
<body>
  <div class="oauth-callback-page">
    <div>
      <div class="loading">Concluindo login…</div>
      <p id="oauth-hint">Aguarde enquanto validamos sua conta.</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js?v=40"></script>
  <script src="./js/auth.js?v=38"></script>
  <script>
    (async function () {
      const hint = document.getElementById("oauth-hint");
      const url = new URL(window.location.href);
      const oauthErr = url.searchParams.get("error_description") || url.searchParams.get("error");
      if (oauthErr) {
        hint.textContent = decodeURIComponent(oauthErr.replace(/\+/g, " "));
        setTimeout(() => {
          window.location.replace(window.LexAuth.lexHomeUrl().replace(/#.*$/, "") + "#/auth/login");
        }, 2500);
        return;
      }

      const pkceCode = url.searchParams.get("code");
      if (!pkceCode) {
        hint.textContent = "Link de login inválido ou expirado.";
        setTimeout(() => {
          window.location.replace(window.LexAuth.lexHomeUrl().replace(/#.*$/, "") + "#/auth/login");
        }, 2500);
        return;
      }

      let session = null;
      let exchangeError = null;

      try {
        const { data, error } = await window.LexAuth.getClient().auth.exchangeCodeForSession(pkceCode);
        if (error) throw error;
        session = data.session;
        url.searchParams.delete("code");
        url.searchParams.delete("state");
        window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
      } catch (err) {
        exchangeError = err;
        console.error("OAuth PKCE exchange failed:", err);
      }

      if (!session?.user) {
        try {
          session = await window.LexAuth.getSession();
        } catch (_) {}
      }

      if (!session?.user) {
        const detail = exchangeError?.message ? ` (${exchangeError.message})` : "";
        hint.textContent = `Não foi possível validar o login Google${detail}. Tente novamente.`;
        setTimeout(() => {
          window.location.replace(window.LexAuth.lexHomeUrl().replace(/#.*$/, "") + "#/auth/login");
        }, 3500);
        return;
      }

      const returnPath = window.LexAuth.readOAuthReturnPath();
      window.LexAuth.clearOAuthReturnPath();
      const target = window.LexAuth.resolveOAuthReturnTarget(returnPath);
      window.location.replace(target);
    })();
  </script>
</body>
</html>
