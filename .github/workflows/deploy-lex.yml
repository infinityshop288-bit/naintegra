name: Deploy Lex (Hostinger)

on:
  push:
    branches: [main]
    paths:
      - "web/lex/**"
      - "scripts/publish_lex_static.sh"
      - ".github/workflows/deploy-lex.yml"
  workflow_dispatch:

concurrency:
  group: deploy-lex-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar em naintegracursos.com.br/lex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static bundle
        run: bash scripts/publish_lex_static.sh

      - name: Deploy via FTPS (Hostinger)
        id: ftp
        if: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT != '' && secrets.FTP_PORT || '21' }}
          protocol: ftps
          local-dir: ./lex/
          server-dir: ${{ secrets.FTP_REMOTE_DIR != '' && secrets.FTP_REMOTE_DIR || './public_html/lex/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.DS_Store

      - name: Deploy via SSH/rsync
        id: ssh
        if: ${{ secrets.SSH_HOST != '' && secrets.SSH_USERNAME != '' && secrets.SSH_PRIVATE_KEY != '' && (secrets.FTP_SERVER == '' || secrets.FTP_PASSWORD == '') }}
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: lex/
          remote_path: ${{ secrets.SSH_REMOTE_DIR != '' && secrets.SSH_REMOTE_DIR || 'public_html/lex/' }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '65002' }}

      - name: Verificar credenciais de deploy
        if: ${{ always() && steps.ftp.outcome == 'skipped' && steps.ssh.outcome == 'skipped' }}
        run: |
          echo "::error::Nenhum secret FTP/SSH configurado."
          echo "1. cp .env.deploy.example .env.deploy"
          echo "2. python3 scripts/setup_github_deploy_secrets.py --from-env .env.deploy"
          echo "3. Reexecute este workflow"
          exit 1

      - name: Smoke test
        if: ${{ success() }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.naintegracursos.com.br/lex/index.html" || true)
          echo "HTTP $code for /lex/index.html"
          if [ "$code" != "200" ]; then
            echo "::warning::CDN pode levar alguns minutos para refletir o deploy."
          fi
