name: Deploy Lex (Hostinger)

on:
  push:
    branches: [main]
    paths:
      - "web/lex/**"
      - "scripts/publish_lex_static.sh"
      - ".github/workflows/deploy-lex.yml"
  workflow_dispatch:

concurrency:
  group: deploy-lex-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar em naintegracursos.com.br/lex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static bundle
        run: bash scripts/publish_lex_static.sh

      - name: Detect deploy method
        id: mode
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "method=ftp" >> "$GITHUB_OUTPUT"
          elif [ -n "$SSH_HOST" ] && [ -n "$SSH_USERNAME" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "method=ssh" >> "$GITHUB_OUTPUT"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via FTPS (Hostinger)
        if: steps.mode.outputs.method == 'ftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./lex/
          server-dir: ./public_html/lex/
          dangerous-clean-slate: false

      - name: Deploy via SSH/rsync
        if: steps.mode.outputs.method == 'ssh'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: lex/
          remote_path: public_html/lex/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: 65002

      - name: Credenciais ausentes
        if: steps.mode.outputs.method == 'none'
        run: |
          echo "::error::Configure FTP ou SSH em GitHub → Settings → Secrets → Actions"
          echo "Rode: python3 scripts/setup_github_deploy_secrets.py --from-env .env.deploy"
          exit 1

      - name: Smoke test
        if: steps.mode.outputs.method != 'none'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.naintegracursos.com.br/lex/index.html" || true)
          echo "HTTP $code for /lex/index.html"
          if [ "$code" != "200" ]; then
            echo "::warning::CDN pode levar alguns minutos para refletir o deploy."
          fi
