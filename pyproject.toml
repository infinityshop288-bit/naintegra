[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naintegra-lex-agent"
version = "0.1.0"
description = "Agente em loop para selecionar, organizar e armazenar legislação, jurisprudência e súmulas vindas do naintegra-crawl (NaIntegra Lex)."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "python-docx>=1.1,<2",
  "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
supabase = ["supabase>=2.4,<3"]
playwright = ["playwright>=1.41,<2"]
meta = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1"]

[project.scripts]
naintegra-lex-agent = "naintegra_lex_agent.agent:main_sync"
naintegra-organize-loop = "naintegra_lex_agent.organize_loop:main_sync"
naintegra-scrape-loop = "naintegra_lex_agent.scrape_loop:main_sync"
naintegra-questions-loop = "naintegra_lex_agent.questions_loop:main_sync"
naintegra-exam-boards-loop = "naintegra_lex_agent.exam_boards_loop:main_sync"
naintegra-qconcursos-studies = "naintegra_lex_agent.concurso_study.cli:main"
naintegra-trilhante-publish = "naintegra_lex_agent.lex_publish:main"
naintegra-norma-normalize = "naintegra_lex_agent.norma_chunks_cli:main"
naintegra-norma-consolidate-loop = "naintegra_lex_agent.norma_consolidate_loop:main"
naintegra-cp-iuris-loop = "naintegra_lex_agent.cp_iuris_loop:main_sync"
naintegra-lexml-legis-weekly = "naintegra_lex_agent.lexml_legis_weekly:main_sync"
naintegra-delegado-api = "naintegra_meta.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/naintegra_lex_agent", "src/naintegra_meta"]

[tool.hatch.build.targets.sdist]
include = ["src", "sql", "web/delegado"]

[tool.ruff]
line-length = 100
target-version = "py311"
